<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

{% if site.goatcounter %}
{% comment %}<!-- GoatCounter skips localhost by itself, so local previews are not counted -->{% endcomment %}
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script>
  /* Fill each [data-goatcounter-path] (see _includes/page-views.html) with the visitor count of
     its paths added together. GoatCounter caches each counter URL for hours, keyed by its date
     range, so the range starts on a different day of 2020-2023 every five minutes: the site had no
     visitors then, so the count is the same, but it is never more than five minutes old. */
  var bucket = Math.floor(Date.now() / 3e5);
  var start = new Date(Date.UTC(2020, 0, 1) + (bucket % 1400) * 864e5).toISOString().slice(0, 10);
  var tomorrow = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
  document.querySelectorAll("[data-goatcounter-path]").forEach(function (el) {
    var paths = el.getAttribute("data-goatcounter-path").split(" ").filter(Boolean);
    Promise.all(paths.map(function (path) {
      return fetch("https://{{ site.goatcounter }}.goatcounter.com/counter/" + encodeURIComponent(path) + ".json?start=" + start + "&end=" + tomorrow)
        .then(function (r) {
          if (r.status === 404) return 0;
          if (!r.ok) throw new Error(r.status);
          /* GoatCounter formats counts as "17 996" */
          return r.json().then(function (data) { return Number(String(data.count).replace(/[^0-9]/g, "")); });
        });
    }))
      .then(function (counts) {
        var total = counts.reduce(function (sum, count) { return sum + count; }, 0);
        el.querySelector(".page-views__count").textContent = total.toLocaleString("en-US");
        el.style.display = "";
      })
      .catch(function () {});
  });
</script>
{% endif %}
